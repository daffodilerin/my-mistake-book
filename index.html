<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會考錯題本神器</title>
    <style>
        /* 保持原有的 CSS 樣式設定 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .upload-area { border: 2px dashed #3498db; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; background-color: #f0f8ff; cursor: pointer; }
        .upload-area:hover { background-color: #e1f0fa; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #2980b9; }
        .admin-btn { background-color: #e74c3c; margin-bottom: 20px; }
        .admin-btn:hover { background-color: #c0392b; }
        .mistake-list { margin-top: 30px; }
        .mistake-card { border: 1px solid #e0e0e0; padding: 15px; margin-bottom: 15px; border-radius: 8px; position: relative; }
        .mistake-card img { max-width: 100%; height: auto; border-radius: 5px; margin-bottom: 10px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; background-color: #34495e; margin-right: 5px; margin-bottom: 10px; }
        .badge.important { background-color: #f1c40f; color: black; }
        .delete-btn { position: absolute; top: 10px; right: 10px; background-color: #ff4757; padding: 5px 10px; width: auto; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <button id="toggleAdminBtn" class="admin-btn">切換為：老師後台 👀</button>
        <h1>📖 會考錯題本神器</h1>
        
        <div id="studentArea">
            <div class="form-group">
                <label for="studentName">姓名 / 座號 (必填)</label>
                <input type="text" id="studentName" placeholder="例如：王小明 01" required>
            </div>
            
            <!-- 支援點擊上傳與 Ctrl+V 貼上 -->
            <div class="upload-area" id="uploadArea">
                <p>📸 點擊選擇圖片，或直接在此處 <b>Ctrl+V</b> 貼上截圖</p>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>
            <img id="previewImage" style="max-width: 100%; display: none; margin-bottom: 15px; border-radius: 5px;">

            <div class="form-group">
                <label for="subjectSelect">科目 (AI 可自動判定)</label>
                <select id="subjectSelect">
                    <option value="">請選擇科目</option>
                    <optgroup label="自然科">
                        <option value="生物">生物</option>
                        <option value="理化">理化</option>
                        <option value="地科">地科</option>
                    </optgroup>
                    <optgroup label="社會科">
                        <option value="地理">地理</option>
                        <option value="歷史">歷史</option>
                        <option value="公民">公民</option>
                    </optgroup>
                    <option value="國文">國文</option>
                    <option value="英文">英文</option>
                    <option value="數學">數學</option>
                </select>
            </div>

            <div class="form-group">
                <label for="errorReason">錯誤原因 (我的盲點是什麼？)</label>
                <select id="errorReason">
                    <option value="觀念不懂">觀念不懂 (需重讀單元)</option>
                    <option value="觀念會但不會應用">觀念會，但不會應用</option>
                    <option value="看錯題目/粗心大意">看錯題目 / 粗心大意</option>
                    <option value="隔一段時間又忘記">隔一段時間又忘記了</option>
                </select>
            </div>

            <div class="form-group">
                <label for="importance">重要程度 (複習優先級)</label>
                <select id="importance">
                    <option value="★★★">★★★ (極重要，考前必看)</option>
                    <option value="★★">★★ (中等，觀念易混淆)</option>
                    <option value="★">★ (普通，稍微留意即可)</option>
                </select>
            </div>

            <button id="analyzeBtn">🤖 AI 解析並存入雲端錯題本</button>
            <p id="statusMsg" style="text-align: center; color: #7f8c8d; margin-top: 10px;"></p>
        </div>

        <div id="adminArea" style="display: none;">
            <h2 style="color: #e74c3c;">👨‍🏫 老師專屬後台 - 全班錯題總覽</h2>
            <button id="downloadWordBtn" style="background-color: #27ae60; margin-bottom: 20px;">📥 匯出全班 Word 檔 (依學生分頁)</button>
        </div>

        <div class="mistake-list" id="mistakeList">
            <!-- 錯題卡片會生成在這裡 -->
        </div>
    </div>

    <!-- 載入 Firebase (使用 ES Module 方式) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ✅ 這裡已經填入您專屬的 Firebase 金鑰！
        const firebaseConfig = {
            apiKey: "AIzaSyAreJJr6qhaCfsrTv40Msv1ARqZ-7XMrvk",
            authDomain: "mistake-book-1aecb.firebaseapp.com",
            projectId: "mistake-book-1aecb",
            storageBucket: "mistake-book-1aecb.firebasestorage.app",
            messagingSenderId: "143355546045",
            appId: "1:143355546045:web:2a360489d128bcce22aad4",
            measurementId: "G-CEX0M6D28F"
        };

        // 初始化 Firebase 與資料庫
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ⚠️ 請在這裡填入您的 Gemini API Key！
        const GEMINI_API_KEY = "AQ.Ab8RN6JLy-rEgUlfxStc5oEkZEWhWnpQydRCcnA3LKapnro7_w";

        let isAdminMode = false;
        let base64Image = "";

        // UI 元素綁定
        const toggleAdminBtn = document.getElementById('toggleAdminBtn');
        const studentArea = document.getElementById('studentArea');
        const adminArea = document.getElementById('adminArea');
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const previewImage = document.getElementById('previewImage');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const statusMsg = document.getElementById('statusMsg');
        const mistakeList = document.getElementById('mistakeList');

       // 切換老師/學生模式 (加入密碼保護)
        toggleAdminBtn.addEventListener('click', () => {
            // 如果準備從學生切換成老師，先要求輸入密碼
            if (!isAdminMode) {
                const password = prompt("請輸入老師專屬通關密碼：");
                // 💡 您可以把雙引號裡面的 0501 改成您想要的密碼！
                if (password !== "0501") { 
                    alert("❌ 密碼錯誤，無法進入老師後台！");
                    return; // 密碼錯誤就直接中斷，不切換畫面
                }
            }

            isAdminMode = !isAdminMode;
            if(isAdminMode) {
                studentArea.style.display = 'none';
                adminArea.style.display = 'block';
                toggleAdminBtn.textContent = '切換為：學生上傳模式 ✏️';
                toggleAdminBtn.style.backgroundColor = '#3498db';
            } else {
                studentArea.style.display = 'block';
                adminArea.style.display = 'none';
                toggleAdminBtn.textContent = '切換為：老師後台 👀';
                toggleAdminBtn.style.backgroundColor = '#e74c3c';
            }
            loadMistakesFromCloud(); // 重新載入對應視角的資料
        });

        // 處理圖片上傳與貼上
        uploadArea.addEventListener('click', () => imageInput.click());
        
        document.addEventListener('paste', (e) => {
            if(isAdminMode) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file') {
                    const blob = item.getAsFile();
                    processImage(blob);
                }
            }
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processImage(e.target.files[0]);
            }
        });

        function processImage(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                base64Image = event.target.result;
                previewImage.src = base64Image;
                previewImage.style.display = 'block';
                statusMsg.textContent = "✅ 圖片載入成功，準備好進行解析！";
            };
            reader.readAsDataURL(file);
        }

        // 呼叫 Gemini AI 進行解析並存入 Firebase
        analyzeBtn.addEventListener('click', async () => {
            const studentName = document.getElementById('studentName').value;
            const errorReason = document.getElementById('errorReason').value;
            const importance = document.getElementById('importance').value;
            let subject = document.getElementById('subjectSelect').value;

            if (!studentName) return alert('請務必填寫姓名/座號！');
            if (!base64Image) return alert('請先貼上或上傳圖片！');
           if (GEMINI_API_KEY === "請將這段文字替換成您的_GEMINI_API_KEY") return alert('老師，您還沒填入 Gemini API Key 喔！');

            statusMsg.textContent = "⏳ AI 正在幫您精準抓出盲點，請稍候...";
            analyzeBtn.disabled = true;

            try {
                // 呼叫 Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "你是一位專業的國中會考家教。請看這張學生的錯題圖片：\n1. 判斷這題屬於哪個科目(國文,英文,數學,生物,理化,地科,地理,歷史,公民)。\n2. 寫出精簡的「正確解答/解析」。\n3. 提煉出一句「💡 下次看到要想到什麼 (整理重點)」。\n請用 JSON 格式回覆，包含: subject, explanation, key_takeaway 三個欄位。不要加 Markdown 標記。" },
                                { inlineData: { mimeType: "image/jpeg", data: base64Image.split(',')[1] } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                let aiResultText = data.candidates[0].content.parts[0].text;
                
                // 清理可能的 Markdown 格式
                aiResultText = aiResultText.replace(/```json/g, "").replace(/```/g, "").trim();
                const aiResult = JSON.parse(aiResultText);

                if(!subject) subject = aiResult.subject;

                // 準備存入雲端的資料包
                const mistakeData = {
                    studentName: studentName,
                    subject: subject,
                    errorReason: errorReason,
                    importance: importance,
                    explanation: aiResult.explanation,
                    keyTakeaway: aiResult.key_takeaway,
                    imageData: base64Image,
                    timestamp: new Date().getTime() // 用來排序
                };

                // 將資料寫入 Firebase Firestore
                await addDoc(collection(db, "mistakes"), mistakeData);
                
                statusMsg.textContent = "✅ 已成功存入雲端錯題本！";
                
                // 清空畫面準備下一題
                base64Image = "";
                previewImage.style.display = 'none';
                
                // 重新載入列表
                loadMistakesFromCloud();

            } catch (error) {
                console.error(error);
                statusMsg.textContent = "❌ 發生錯誤，請檢查網路或 API Key 設定。";
            } finally {
                analyzeBtn.disabled = false;
            }
        });

        // 從 Firebase 讀取資料並顯示
        async function loadMistakesFromCloud() {
            mistakeList.innerHTML = '<p style="text-align:center;">載入中...</p>';
            const q = query(collection(db, "mistakes"), orderBy("timestamp", "desc"));
            const querySnapshot = await getDocs(q);
            
            mistakeList.innerHTML = '';
            
            if(querySnapshot.empty) {
                mistakeList.innerHTML = '<p style="text-align:center;">目前還沒有錯題紀錄喔！</p>';
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;

                // 如果是學生視角，且名字不符（或沒填寫名字），則跳過不顯示，或者也可以選擇都顯示但不能刪除
                // 這裡的邏輯先設定為：老師看全部，學生只看畫面目前輸入的姓名
                const currentStudent = document.getElementById('studentName').value;
                if (!isAdminMode && currentStudent && data.studentName !== currentStudent) {
                    return; // 學生視角過濾掉別人的題目
                }

                const card = document.createElement('div');
                card.className = 'mistake-card';
                card.innerHTML = `
                    <button class="delete-btn" data-id="${docId}">🗑️ 刪除</button>
                    <div>
                        <span class="badge">${data.studentName}</span>
                        <span class="badge">${data.subject}</span>
                        <span class="badge" style="background-color: #e67e22;">原因：${data.errorReason}</span>
                        <span class="badge important">${data.importance}</span>
                        <span class="badge" style="background-color: #7f8c8d;">${new Date(data.timestamp).toLocaleDateString()}</span>
                    </div>
                    <img src="${data.imageData}" alt="錯題圖片">
                    <div style="background-color: #f8f9fa; padding: 15px; border-left: 4px solid #3498db; margin-bottom: 10px;">
                        <strong>正確答案 & 詳解：</strong><br>
                        ${data.explanation}
                    </div>
                    <div style="background-color: #fff3e0; padding: 15px; border-left: 4px solid #f39c12;">
                        <strong>💡 下次看到要想到什麼：</strong><br>
                        <span style="color: #d35400; font-weight: bold;">${data.keyTakeaway}</span>
                    </div>
                `;
                mistakeList.appendChild(card);
            });

            // 綁定刪除按鈕事件
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    if(confirm("確定要刪除這題嗎？")) {
                        const id = e.target.getAttribute('data-id');
                        await deleteDoc(doc(db, "mistakes", id));
                        loadMistakesFromCloud();
                    }
                });
            });
        }

        // 初始化載入
        loadMistakesFromCloud();
    </script>
</body>
</html>
